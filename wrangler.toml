name = "beat"
main = "works.js"
compatibility_date = "2026-07-27"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/dl/*", "/webhook"]

[[d1_databases]]
binding = "DB"
database_name = "image-host"
database_id = "1a56f6f5-e29e-442e-887a-52e5a4103233"
migrations_dir = "migrations"

[vars]
MAX_SIZE_MB = "20"
WEB_UPLOAD_MAX_MB = "20"
SESSION_TTL_HOURS = "24"
